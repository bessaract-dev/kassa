<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Касса · прототип функций</title>
<!-- Прототип ФУНКЦИЙ (версия 0.4: План, доходы, лимит на день). Стиль — из style.html (CSS скопирован 1:1).
     Полностью локальный: без сети, данные — в памяти браузера (localStorage), только для пробы. -->
<style>
@font-face{font-family:Tektur;src:url(../app/src/main/res/font/tektur.ttf) format("truetype");font-weight:400 900}
@font-face{font-family:"JetBrains Mono";src:url(../app/src/main/res/font/jetbrains_mono.ttf) format("truetype");font-weight:100 800}

:root{
  /* ПАЛИТРА v3 */
  --bg:#0E0F0F;        /* угольный фон */
  --surface:#17191A;   /* тёмная панель */
  --raised:#212425;    /* приподнятая / нажатая */
  --line:#34383A;      /* линии, рамки */
  --grey:#8A8F91;      /* серые плашки, приглушённый текст */
  --text:#E9EAE4;      /* основной текст на тёмном */
  --paper:#EFEFEA;     /* белые панели */
  --ink:#0B0C0C;       /* текст на белом и лайме */
  --lime:#C8FF00;      /* акцент */
  --bad:#FF3D2E;       /* перерасход */
  --warn:#FF9F0A;      /* предупреждение */

  /* ШРИФТЫ */
  --display:Tektur, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
  --cjk:"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","PingFang SC",sans-serif;

  /* ДВИЖЕНИЕ */
  --t-fast:120ms;   /* нажатия, переключатели */
  --t-base:220ms;   /* появление элементов */
  --t-slow:360ms;   /* лист, смена экрана */
  --ease-out:cubic-bezier(.2,0,0,1);   /* резкий старт, мягкий стоп */
  --ease-in:cubic-bezier(.4,0,1,1);
  --stagger:45ms;

  /* ФОРМЫ */
  --cut:14px; --cut-s:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#060707;color:var(--text);font:400 calc(13px * var(--fs, 1))/1.45 var(--mono)}
body{min-height:100vh;padding:76px 16px 64px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.cjk{font-family:var(--cjk);font-weight:700}

/* ===== раскладка страницы ===== */
.page{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:start}
@media (max-width:900px){.page{grid-template-columns:1fr}.phone-wrap{justify-self:center}}
.phone-wrap{position:sticky;top:70px}
.phone-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}

/* ===== телефон ===== */
.phone{--pw:390px;width:calc(var(--pw) + 20px);height:calc(var(--pw) * 2.1 + 20px);flex:none;border-radius:44px;padding:10px;background:#1b1d1e;box-shadow:0 0 0 1px #2a2d2e,0 30px 80px #000}
.screen{font-size:calc(13px * var(--fs, 1));position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:14px 16px 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* фон: сетка + трассы */
.grid-bg{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);
  background-size:24px 24px}
.traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.traces path{fill:none;stroke:var(--line);stroke-width:1}
.traces .hot{stroke:var(--lime);stroke-width:2;stroke-dasharray:60 800;animation:flow 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-860}}

/* служебная строка */
.sys{display:flex;justify-content:space-between;align-items:center;font-size:calc(10px * var(--fs, 1));color:var(--grey);letter-spacing:.08em;padding:22px 4px 0}
.sys b{color:var(--text);font-weight:500}

/* шапка экрана */
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:18px 0 14px;position:relative}
.head h1{font:800 calc(34px * var(--fs, 1))/0.9 var(--display);letter-spacing:.01em;text-transform:uppercase}
.head .idx{display:flex;gap:6px;font-size:calc(10px * var(--fs, 1));color:var(--grey);margin-top:8px}
.head .idx span.on{color:var(--lime);border-bottom:2px solid var(--lime)}
.vtag{display:flex;flex-direction:column;gap:2px;font-family:var(--cjk);font-weight:800;font-size:calc(22px * var(--fs, 1));line-height:1;color:var(--text);
  border-left:2px solid var(--lime);padding-left:6px;flex:none}

/* ===== панели ===== */
.panel{position:relative;padding:16px;margin-bottom:12px}
/* вырез: срез справа сверху + «ступенька» в верхней грани + срез слева снизу */
/* v3.1: крупные срезы как у референса-«жетона» + оторванные куски (см. .hud-wrap) */
.shape-a{clip-path:polygon(22px 0,calc(100% - 104px) 0,calc(100% - 96px) 8px,calc(100% - 34px) 8px,100% 42px,100% calc(100% - 28px),calc(100% - 28px) 100%,26px 100%,8px calc(100% - 18px),8px 58%,0 calc(58% - 8px),0 22px)}
.shape-b{clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 38%,calc(100% - 8px) calc(38% + 8px),calc(100% - 8px) calc(100% - 22px),calc(100% - 30px) 100%,42% 100%,calc(42% - 8px) calc(100% - 8px),24px calc(100% - 8px),0 calc(100% - 32px))}
/* обёртка панели: оторванные куски того же цвета, что и панель */
.hud-wrap{position:relative;margin-bottom:12px;--hud-c:var(--line)}
.hud-wrap>.panel{margin-bottom:0}
.hud-wrap:has(>.lime){--hud-c:var(--lime)}
.hud-wrap:has(>.paper){--hud-c:var(--paper)}
.hud-wrap:has(>.over){--hud-c:var(--bad)}
.hud-wrap>i{position:absolute;pointer-events:none;background:var(--hud-c);transition:background var(--t-base)}
/* A: планка слева снаружи, штриховка в нижнем вырезе, рельс над правым срезом */
.hud-a .bar{left:-9px;top:34px;width:5px;height:calc(58% - 52px);clip-path:polygon(0 5px,100% 0,100% 100%,0 calc(100% - 5px))}
.hud-a .hatch-l{left:0;top:calc(58% + 6px);width:5px;height:calc(42% - 34px);background:repeating-linear-gradient(-45deg,var(--hud-c) 0 3px,transparent 3px 6px)}
.hud-a .rail{right:-8px;top:0;width:104px;height:90px;background:none}
.hud-a .rail svg{display:block;width:100%;height:100%;overflow:visible}
.hud-a .rail path{fill:none;stroke:var(--hud-c);stroke-width:2;transition:stroke var(--t-base)}
/* B: планка в правом вырезе, отдельный уголок снизу слева */
.hud-b .bar{right:0;top:calc(38% + 18px);width:4px;height:calc(62% - 46px)}
.hud-b .corner{left:-8px;bottom:-1px;width:30px;height:30px;clip-path:polygon(0 0,4px 0,4px 4px,30px 30px,26px 30px,0 4px)}
.hud-b .tick{left:-9px;top:20px;width:5px;height:30%;background:repeating-linear-gradient(-45deg,var(--hud-c) 0 3px,transparent 3px 6px)}
.shape-c{--cut-s:12px;clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.lime{background:var(--lime);color:var(--ink)}
.paper{background:var(--paper);color:var(--ink)}
.dark{background:var(--line)}
.dark::before{content:"";position:absolute;inset:1px;background:var(--surface);clip-path:inherit;z-index:0}
.dark>*{position:relative;z-index:1}
.over.lime{background:var(--bad);color:var(--ink)}

.lbl{display:flex;justify-content:space-between;align-items:center;font-size:calc(10px * var(--fs, 1));letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.lbl .cjk{font-size:calc(13px * var(--fs, 1));letter-spacing:.05em}
.big{font:800 calc(54px * var(--fs, 1))/1 var(--display);letter-spacing:-.01em;margin:12px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.5em;font-weight:600;margin-left:4px}
.mid{font:700 calc(30px * var(--fs, 1))/1 var(--display);margin:10px 0 8px;font-variant-numeric:tabular-nums}
.sub{font-size:calc(11px * var(--fs, 1));opacity:.75}
.serial{position:absolute;right:14px;bottom:10px;font-size:calc(9px * var(--fs, 1));letter-spacing:.1em;opacity:.6}

/* декор */
.hatch{height:10px;width:64px;background:repeating-linear-gradient(-45deg,currentColor 0 3px,transparent 3px 7px)}
.hatch.v{position:absolute;right:16px;top:50px;height:46px;width:12px;opacity:.85}
.arrows{font:900 calc(14px * var(--fs, 1))/1 var(--display);letter-spacing:-2px}
.cross{position:absolute;width:9px;height:9px;opacity:.5}
.cross::before,.cross::after{content:"";position:absolute;background:currentColor}
.cross::before{left:4px;top:0;width:1px;height:9px}.cross::after{top:4px;left:0;height:1px;width:9px}
.bar-row{display:flex;gap:10px;align-items:center;margin-top:10px}

/* сегментная шкала дней */
.segs{display:flex;gap:3px;margin-top:10px}
.segs i{flex:1;height:8px;background:#0B0C0C22}
.segs i.on{background:var(--ink)}
.segs i.now{background:var(--lime);outline:1px solid var(--ink)}

/* операции */
.ops-h{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-size:calc(10px * var(--fs, 1));letter-spacing:.12em;color:var(--grey);text-transform:uppercase}
.ops-h .cjk{color:var(--text);font-size:calc(12px * var(--fs, 1))}
.op{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 12px;margin-bottom:6px}
.op .ic{width:34px;height:34px;display:grid;place-items:center;font:700 calc(12px * var(--fs, 1)) var(--cjk);background:var(--raised);color:var(--lime)}
.op .n{font-size:calc(13px * var(--fs, 1))}.op .m{font-size:calc(10px * var(--fs, 1));color:var(--grey)}
.op .a{font:700 calc(16px * var(--fs, 1)) var(--display);font-variant-numeric:tabular-nums}

/* стартовый экран */
.steps{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:baseline;font-size:calc(12px * var(--fs, 1))}
.steps b{font:800 calc(16px * var(--fs, 1)) var(--display)}
.empty-row{display:flex;gap:12px;align-items:center;color:var(--grey);font-size:calc(12px * var(--fs, 1));padding:14px}
.empty-row .cjk{font-size:calc(20px * var(--fs, 1));color:var(--line)}
[hidden]{display:none!important}

/* нижняя навигация */
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,1fr) 82px repeat(2,1fr);align-items:center;padding:0 6px 10px;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:calc(9px * var(--fs, 1));letter-spacing:.08em;color:var(--grey);text-transform:uppercase;padding:8px 0;position:relative}
.nav button .cjk{font-size:calc(15px * var(--fs, 1))}
.nav button.on{color:var(--lime)}
.nav button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--lime)}
.nav .fab{justify-self:center;padding:0;width:62px;height:62px;margin-top:-34px;background:var(--lime);color:var(--ink);font:800 calc(34px * var(--fs, 1))/1 var(--display);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);display:grid;place-items:center}

/* нажатие: сдвиг + инверсия на миг */
.press{transition:transform var(--t-fast) var(--ease-out),filter var(--t-fast)}
.press:active{transform:translateY(2px) scale(.98);filter:invert(1)}

/* ===== нижний лист ===== */
.scrim{position:absolute;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity var(--t-slow) var(--ease-out);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--surface);padding:22px 16px 22px;
  clip-path:polygon(0 18px,30% 18px,calc(30% + 18px) 0,100% 0,100% 100%,0 100%);
  transform:translateY(105%);transition:transform var(--t-slow) var(--ease-out)}
.sheet::after{content:"";position:absolute;left:0;right:0;top:18px;height:2px;background:var(--lime);transform-origin:left;transform:scaleX(0);transition:transform var(--t-slow) var(--ease-out) 120ms}
.screen.sheet-open .scrim{opacity:1;pointer-events:auto}
.screen.sheet-open .sheet{transform:none}
.screen.sheet-open .sheet::after{transform:scaleX(1)}
.sheet h3{font:800 calc(20px * var(--fs, 1)) var(--display);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sheet h3 .cjk{font-size:calc(14px * var(--fs, 1));color:var(--lime)}
.amount{font:800 calc(48px * var(--fs, 1)) var(--display);margin:14px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;display:flex;align-items:center}
.amount .caret{width:3px;height:40px;background:var(--lime);margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:7px 10px;font-size:calc(11px * var(--fs, 1));background:var(--raised);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.chip.on{background:var(--lime);color:var(--ink);font-weight:700}
.btn{--btn-shape:polygon(0 18px,12px 6px,24% 6px,calc(24% + 6px) 0,calc(66% - 6px) 0,66% 6px,calc(100% - 18px) 6px,100% 24px,100% calc(100% - 10px),calc(100% - 10px) 100%,26px 100%,0 calc(100% - 26px));padding:24px 26px 20px!important;display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;gap:12px;font:800 calc(14px * var(--fs, 1)) var(--display);text-transform:uppercase;letter-spacing:.02em}
.btn>span:first-child{white-space:nowrap}
.btn.primary{background:var(--lime);color:var(--ink);clip-path:var(--btn-shape)}
.btn.ghost{color:var(--text);background:var(--line);clip-path:var(--btn-shape);position:relative}
.btn.ghost::before{content:"";position:absolute;inset:1px;background:var(--surface);clip-path:inherit;z-index:-1}
.btn.ghost{isolation:isolate}

/* ===== появление: «вытирание» панелей ===== */
.reveal{animation:wipe var(--t-base) var(--ease-out) both;animation-delay:calc(var(--i,0) * var(--stagger))}
@keyframes wipe{
  0%{opacity:0;transform:translateY(8px);filter:brightness(2.2)}
  60%{opacity:1;filter:brightness(1.4)}
  100%{opacity:1;transform:none;filter:none}
}
/* загрузка экрана */
.boot{position:absolute;inset:0;background:var(--bg);z-index:20;padding:80px 22px;font-size:calc(11px * var(--fs, 1));color:var(--grey);display:none}
.boot.on{display:block}
.boot p{white-space:pre;opacity:0}
.boot p.ok::after{content:" [OK]";color:var(--lime)}
.boot .logo{font:800 calc(30px * var(--fs, 1)) var(--display);color:var(--text);margin-bottom:16px;opacity:1}
.boot .logo .cjk{color:var(--lime);font-size:calc(22px * var(--fs, 1));margin-left:8px}

/* ===== глитч ===== */
.glitch{position:relative}
.glitch.fire{animation:gl 180ms steps(2) 1}
.glitch.fire::before,.glitch.fire::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch.fire::before{color:var(--bad);transform:translate(-3px,0);clip-path:inset(10% 0 55% 0);mix-blend-mode:screen}
.glitch.fire::after{color:#00E5FF;transform:translate(3px,0);clip-path:inset(60% 0 8% 0);mix-blend-mode:screen}
@keyframes gl{0%{transform:translate(0)}25%{transform:translate(-2px,1px) skewX(-6deg)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0) skewX(4deg)}100%{transform:none}}
/* глитч-полоса через весь экран */
.tear{position:absolute;left:0;right:0;height:14px;z-index:15;pointer-events:none;background:linear-gradient(90deg,transparent,#C8FF0033 20%,#ffffff22 50%,#FF3D2E33 80%,transparent);mix-blend-mode:screen;display:none}
.tear.on{display:block;animation:tear 160ms steps(3) 1}
@keyframes tear{0%{transform:translateX(-12px)}50%{transform:translateX(10px)}100%{transform:translateX(0)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

/* переключатель вида страницы */
.view-ctl{position:fixed;top:12px;right:16px;z-index:50;display:flex;gap:4px;align-items:center;background:#060707e6;padding:6px;outline:1px solid var(--line);outline-offset:-1px}
.view-ctl .lab{font-size:calc(10px * var(--fs, 1));letter-spacing:.12em;color:var(--grey);text-transform:uppercase;margin:0 6px}
body.phone-only .spec{display:none}
body.phone-only .page{grid-template-columns:auto;justify-content:center}
body.phone-only .phone-wrap{position:static}

.view-ctl{flex-wrap:wrap;max-width:calc(100vw - 32px);justify-content:flex-end}
.view-ctl .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.phone-wrap{transform-origin:top center}
/* калибровка: банковская карта 85,6 × 54 мм */
.calib{position:fixed;inset:0;z-index:60;background:#000d;display:none;place-items:center}
.calib.on{display:grid}
.calib .box{background:var(--surface);padding:20px;outline:1px solid var(--line);max-width:92vw;text-align:center}
.calib .card{margin:16px auto;border:2px dashed var(--lime);border-radius:3.2mm}
.calib p{color:var(--grey);font-size:12px;max-width:420px;margin:0 auto 10px}


/* ===== прототип функций ===== */
body{padding:24px 16px 64px}
.page{grid-template-columns:auto;justify-content:center}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 auto 14px;max-width:560px}
.tools .lab{font-size:10px;letter-spacing:.12em;color:var(--grey);text-transform:uppercase;align-self:center;margin:0 4px}
.note-top{max-width:560px;margin:0 auto 12px;color:var(--grey);font-size:12px;text-align:center}
/* сегмент Трата / Доход */
.seg{display:flex;gap:6px;margin:12px 0 4px}
.seg button{flex:1;padding:9px 0;font:800 calc(13px * var(--fs, 1)) var(--display);text-transform:uppercase;background:var(--raised);color:var(--grey);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.seg button.on{background:var(--lime);color:var(--ink)}
.f-lbl{font-size:calc(10px * var(--fs, 1));letter-spacing:.12em;color:var(--grey);text-transform:uppercase;font-weight:600;margin:12px 0 6px}
.inp{width:100%;background:var(--raised);border:0;border-left:2px solid transparent;color:var(--text);font:400 calc(13px * var(--fs, 1)) var(--mono);padding:9px 10px;outline:0}
.inp:focus{border-left-color:var(--lime)}
.inp.big{background:none;border:0;border-bottom:2px solid var(--line);font:800 calc(48px * var(--fs, 1)) var(--display);padding:0 0 6px;caret-color:var(--lime)}
.inp.big:focus{border-bottom-color:var(--line)}
.date-row{display:flex;align-items:center;gap:6px}
.date-row .d{min-width:120px;text-align:center;cursor:pointer}
.date-row .d.today{color:var(--lime)}
.err{color:var(--bad);font-size:calc(11px * var(--fs, 1));margin-top:8px}
.info{color:var(--grey);font-size:calc(12px * var(--fs, 1));margin:12px 0 4px}
.sheet{max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet .btn{margin-top:8px}
.op{cursor:pointer}
.op .st{font-size:calc(10px * var(--fs, 1));letter-spacing:.08em;text-transform:uppercase}
.op .st.ok{color:var(--lime)}.op .st.warn{color:var(--warn)}.op .st.wait{color:var(--grey)}
.op .a.pos{color:var(--lime)}
.op.paid{opacity:.62}
.mini{padding:8px 10px;font:800 calc(11px * var(--fs, 1)) var(--display);text-transform:uppercase;background:var(--lime);color:var(--ink);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);white-space:nowrap}
.op4{grid-template-columns:34px 1fr auto auto}
.add-row{display:flex;align-items:center;gap:10px;width:100%;padding:12px;margin-bottom:6px;color:var(--grey);font-size:calc(12px * var(--fs, 1));outline:1px dashed var(--line);outline-offset:-1px}
.add-row b{color:var(--lime);font:800 calc(18px * var(--fs, 1)) var(--display)}
.hint{display:flex;gap:12px;align-items:center}
.hint .cjk{font-size:calc(22px * var(--fs, 1));color:var(--lime)}
.day-h{display:flex;justify-content:space-between;margin:16px 2px 8px;font-size:calc(10px * var(--fs, 1));letter-spacing:.12em;color:var(--grey);text-transform:uppercase}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:8px 14px;font-size:calc(12px * var(--fs, 1));z-index:30;white-space:nowrap}
</style>
</head>
<body>
<p class="note-top">Прототип функций 0.4: «План» (постоянные доходы и обязательные платежи с отметкой «оплачено»), доход в листе «+», лимит на день на «Сегодня». Данные живут только в этом браузере.</p>
<div class="tools">
  <span class="lab">Данные</span>
  <button class="small-btn" id="demoBtn">Заполнить примером</button>
  <button class="small-btn" id="clearBtn">Очистить</button>
  <span class="lab">Шрифт</span>
  <button class="small-btn" data-fs="1">100%</button>
  <button class="small-btn" data-fs="1.15">115%</button>
  <button class="small-btn on" data-fs="1.3">130%</button>
</div>
<div class="page">
  <div class="phone-wrap">
    <div class="phone" style="--pw:393px;--fs:1.3"><div class="screen" id="screen">
      <div class="grid-bg"></div>
      <svg class="traces" viewBox="0 0 370 800" preserveAspectRatio="none" aria-hidden="true">
        <path d="M370 150 H300 L270 180 V330 L240 360 H190"/>
        <path d="M0 540 H40 L70 570 V690 L100 720 H170"/>
        <path class="hot" d="M370 150 H300 L270 180 V330 L240 360 H190"/>
        <path class="hot" style="animation-delay:-3s" d="M0 540 H40 L70 570 V690 L100 720 H170"/>
      </svg>
      <div class="scroll" id="scroll"></div>
      <nav class="nav" id="nav">
        <button class="press" data-tab="home"><span class="cjk">今日</span>Сегодня</button>
        <button class="press" data-tab="hist"><span class="cjk">履歴</span>История</button>
        <button class="fab press" id="fab" aria-label="Добавить">+</button>
        <button class="press" data-tab="plan"><span class="cjk">計画</span>План</button>
        <button class="press" data-tab="debt"><span class="cjk">負債</span>Долги</button>
      </nav>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet"></div>
    </div></div>
  </div>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const screen = $('#screen'), scroll = $('#scroll'), sheet = $('#sheet');
  const tearEl = document.createElement('div'); tearEl.className = 'tear'; screen.appendChild(tearEl);

  /* ---------- утилиты ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
  const fmtN = n => { const r = Math.round(n); return (r < 0 ? '−' : '') + Math.abs(r).toLocaleString('ru-RU').replace(/\s/g, ' '); };
  const fmt = n => fmtN(n) + ' ₽';
  // как parseAmount в приложении: самый длинный числовой префикс, запятая = точка
  const parseAmt = s => { const m = String(s).replace(/\s/g, '').replace(',', '.').match(/^[+-]?(\d+\.?\d*|\.\d+)/); return m ? Math.round(parseFloat(m[1]) * 100) / 100 : 0; };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
  const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const dayTitle = s => { const d = new Date(s + 'T12:00'); return `${d.getDate()} ${MON[d.getMonth()]}, ${WD[d.getDay()]}`; };
  const formDay = s => { const t = today(); return s === t ? 'Сегодня' : s === addDays(t, -1) ? 'Вчера' : s === addDays(t, -2) ? 'Позавчера' : dayTitle(s).split(',')[0]; };
  const time = ts => new Date(ts).toTimeString().slice(0, 5);

  /* ---------- данные (только этот браузер) ---------- */
  const KEY = 'kassa.proto04';
  const ICON = { 'Продукты': '食', 'Кафе и рестораны': '茶', 'Транспорт': '車', 'Дом': '家', 'Развлечения': '楽', 'Связь и подписки': '信', 'Здоровье': '医', 'Одежда': '服', 'Дети': '子', 'Подарки': '贈', 'Прочее': '他', 'Кредиты': '債', 'Накопления': '貯', 'Зарплата': '給', 'Подработка': '副', 'Прочий доход': '入' };
  const SHORT = { 'Кафе и рестораны': 'Кафе', 'Связь и подписки': 'Связь', 'Прочий доход': 'Прочее' };
  function defaults() {
    const exp = ['Продукты', 'Кафе и рестораны', 'Транспорт', 'Дом', 'Связь и подписки', 'Здоровье', 'Одежда', 'Развлечения', 'Дети', 'Подарки', 'Прочее'];
    const inc = ['Зарплата', 'Подработка', 'Прочий доход'];
    return {
      cats: [...exp.map(n => ({ id: uid(), name: n, type: 'exp' })), { id: 'c_loan', name: 'Кредиты', type: 'exp' }, { id: 'c_goal', name: 'Накопления', type: 'exp' }, ...inc.map(n => ({ id: uid(), name: n, type: 'inc' }))],
      persons: ['Я', 'Варя', 'Ира', 'Мама'], rec: [], tx: [],
    };
  }
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!S || !S.cats) S = defaults();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const cat = id => S.cats.find(c => c.id === id);
  const catName = id => cat(id)?.name || 'Без категории';
  const icon = id => ICON[cat(id)?.name] || '支';
  const userCats = t => S.cats.filter(c => c.type === t && c.id !== 'c_loan' && c.id !== 'c_goal');
  const monthTx = k => S.tx.filter(t => t.d.slice(0, 7) === k);

  /* ---------- расчёты: 1:1 из kassa.html (budget, paidThisMonth) ---------- */
  function budget() {
    const td = today(), k = td.slice(0, 7), now = new Date();
    const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), left = dim - now.getDate() + 1;
    const tx = monthTx(k);
    const planInc = sum(S.rec.filter(r => r.type === 'inc'), r => r.amt);
    // кредиты и цели появятся в 0.6–0.7; пока в fixed только обязательные платежи
    const fixed = sum(S.rec.filter(r => r.type === 'exp'), r => r.amt);
    const free0 = x => !x.ref;
    const varSpent = sum(tx.filter(x => x.t === 'exp' && free0(x)), x => x.rub);
    const spentToday = sum(tx.filter(x => x.t === 'exp' && free0(x) && x.d === td), x => x.rub);
    const extraInc = sum(tx.filter(x => x.t === 'inc' && free0(x)), x => x.rub);
    const free = planInc + extraInc - fixed - varSpent;
    const dayLimit = (free + spentToday) / left;
    return { k, dim, left, planInc, fixed, varSpent, spentToday, extraInc, free, dayLimit, leftToday: dayLimit - spentToday,
      spentAllToday: sum(tx.filter(x => x.t === 'exp' && x.d === td), x => x.rub) };
  }
  const paidTx = id => monthTx(today().slice(0, 7)).find(t => t.ref && t.ref.k === 'rec' && t.ref.id === id);

  /* ---------- куски разметки ---------- */
  let anim = true, ri = 0;
  const rv = () => anim ? ` reveal" style="--i:${Math.min(ri++, 8)}` : '';
  const lbl = (t, c) => `<div class="lbl"><span>${t}</span><span class="cjk">${c}</span></div>`;
  const opsH = (c, t, r) => `<div class="ops-h${rv()}"><span><span class="cjk">${c}</span> &nbsp;${t}</span><span>${r}</span></div>`;
  const empty = (c, t) => `<div class="panel dark shape-c empty-row${rv()}"><span class="cjk">${c}</span><span>${t}</span></div>`;
  function txRow(t) {
    const inc = t.t === 'inc', mark = t.ref ? (inc ? 'получено по плану' : 'по плану') : '';
    // операция по плану называется как строка плана, а не как категория
    const title = t.ref ? t.note : catName(t.cat);
    const meta = [inc ? '' : t.who, mark, t.ref ? '' : t.note, time(t.ts)].filter(Boolean).join(' · ');
    return `<div class="panel dark shape-c op${rv()}" data-act="editTx" data-id="${t.id}"><div class="ic"${inc ? ' style="color:var(--ink);background:var(--lime)"' : ''}>${inc ? (ICON[catName(t.cat)] || '入') : icon(t.cat)}</div><div><div class="n">${esc(title)}</div><div class="m">${esc(meta)}</div></div><div class="a${inc ? ' pos' : ''}">${inc ? '+' : '−'}${fmtN(t.rub)}</div></div>`;
  }
  // строка плана: статус за этот месяц + кнопка «Оплатил/Получил»
  function recRow(r, withBtn) {
    const p = paidTx(r.id), dnow = new Date().getDate(), inc = r.type === 'inc';
    const st = p ? `<span class="st ok">✓ ${inc ? 'получено' : 'оплачено'} ${+p.d.slice(8)}-го</span>`
      : r.day < dnow ? `<span class="st warn">срок был ${r.day}-го</span>` : `<span class="st wait">ждёт ${r.day}-го</span>`;
    const btn = withBtn && !p ? `<button class="mini press" data-act="postRec" data-id="${r.id}">${inc ? 'Получил' : 'Оплатил'}</button>` : '';
    return `<div class="panel dark shape-c op${btn ? ' op4' : ''}${p ? ' paid' : ''}${rv()}" data-act="${withBtn ? 'editRec' : 'editRec'}" data-id="${r.id}"><div class="ic"${inc ? ' style="color:var(--ink);background:var(--lime)"' : ''}>${inc ? (ICON[catName(r.cat)] || '入') : icon(r.cat)}</div><div><div class="n">${esc(r.name)}</div><div class="m">${st}</div></div><div class="a${inc ? ' pos' : ''}">${inc ? '+' : '−'}${fmtN(r.amt)}</div>${btn}</div>`;
  }
  const byDay = r => r.slice().sort((a, b) => a.day - b.day);

  /* ---------- экраны ---------- */
  const TABS = { home: ['Сегодня', '今日'], hist: ['История', '履歴'], plan: ['План', '計画'], debt: ['Долги', '負債'] };
  let tab = 'home';
  function head() {
    const b = budget(), d = new Date(), [t, c] = TABS[tab];
    const idx = Object.keys(TABS).map((k, i) => `<span${k === tab ? ' class="on"' : ''}>0${i + 1}</span>`).join('');
    return `<div class="sys${rv()}"><span>KS-01 // <b>${d.toLocaleDateString('ru-RU')}</b> // ${WD[d.getDay()].toUpperCase()}</span><span>残 <b>${b.left}</b> ДН · <span class="arrows">⇲⇲</span></span></div>
      <div class="head${rv()}"><div><h1 class="glitch" data-text="${t}">${t}</h1><div class="idx">${idx}</div></div><div class="vtag">${[...c].map(x => `<span>${x}</span>`).join('')}</div></div>`;
  }
  function vHome() {
    const b = budget(), td = today(), tTx = S.tx.filter(t => t.d === td).sort((a, z) => z.ts - a.ts);
    const noIncome = b.planInc + b.extraInc === 0;
    let h = '';
    if (noIncome) {
      h += `<div class="panel lime shape-a${rv()}" style="padding-top:24px">${lbl('Потрачено сегодня', '支出')}
        <div class="big glitch" id="heroNum" data-text="${fmtN(b.spentAllToday)} ₽"><span class="num" data-val="${b.spentAllToday}">${fmtN(b.spentAllToday)}</span><small>₽</small></div>
        <div class="sub">операций сегодня: ${tTx.length}</div><div class="bar-row"><div class="hatch"></div><span class="arrows">⇲⇲⇲</span></div><span class="serial">SN 48-1508F</span></div>
        <div class="panel paper shape-b${rv()}" style="padding-bottom:20px">${lbl('Лимит на день', '限度')}
        <div class="hint" style="margin-top:8px"><span class="cjk" style="color:var(--ink)">計画</span><span>Добавь доходы и обязательные платежи во вкладке «План» — тогда здесь будет видно, сколько можно тратить в день.</span></div>
        <button class="btn primary press" data-act="goPlan" style="margin-top:14px"><span>Открыть план</span><span class="arrows">⇲⇲</span></button></div>`;
    } else {
      const over = b.leftToday < 0;
      h += `<div class="panel lime shape-a${over ? ' over' : ''}${rv()}" style="padding-top:24px">${lbl(over ? 'Перерасход за сегодня' : 'Осталось на сегодня', over ? '超過' : '残高')}
        <div class="big glitch" id="heroNum" data-text="${fmtN(b.leftToday)} ₽"><span class="num" data-val="${b.leftToday}">${fmtN(b.leftToday)}</span><small>₽</small></div>
        <div class="sub">лимит ${fmtN(b.dayLimit)} · потрачено ${fmtN(b.spentToday)}</div>
        <div class="bar-row"><div class="hatch"></div><span class="arrows">⇲⇲⇲</span></div><div class="hatch v"></div><span class="serial">SN 48-1508F</span></div>
        <div class="panel paper shape-b${rv()}" style="padding-bottom:24px">${lbl('Свободно до конца месяца', '月末')}
        <div class="mid"><span class="num" data-val="${b.free}">${fmtN(b.free)}</span> ₽</div>
        <div class="segs">${Array.from({ length: b.dim }, (_, i) => `<i class="${i + 1 < new Date().getDate() ? 'on' : i + 1 === new Date().getDate() ? 'now' : ''}"></i>`).join('')}</div>
        <div class="sub" style="margin-top:6px">дней осталось: ${b.left} из ${b.dim} · обязательные ${fmtN(b.fixed)}</div></div>`;
      const due = byDay(S.rec.filter(r => !paidTx(r.id)));
      if (due.length) h += opsH('予定', 'Ждут в этом месяце', String(due.length).padStart(2, '0') + ' шт') + due.map(r => recRow(r, true)).join('');
    }
    h += opsH('履歴', 'Операции сегодня', String(tTx.length).padStart(2, '0') + ' шт');
    h += tTx.length ? tTx.map(txRow).join('') : empty('空', 'Пока пусто. Нажми «+», чтобы записать трату.');
    return h;
  }
  function vHist() {
    const k = today().slice(0, 7), tx = monthTx(k), exp = sum(tx.filter(t => t.t === 'exp'), t => t.rub), inc = sum(tx.filter(t => t.t === 'inc'), t => t.rub);
    let h = `<div class="panel paper shape-b${rv()}" style="padding-bottom:20px">${lbl('Месяц', '今月')}
      <div class="mid">−<span class="num" data-val="${exp}">${fmtN(exp)}</span> ₽</div><div class="sub" style="margin-top:6px">расходы · доходы +${fmtN(inc)}</div></div>`;
    if (!tx.length) return h + empty('空', 'В этом месяце операций пока нет.');
    const days = [...new Set(tx.map(t => t.d))].sort().reverse();
    days.forEach(d => {
      const l = tx.filter(t => t.d === d).sort((a, z) => z.ts - a.ts), e = sum(l.filter(t => t.t === 'exp'), t => t.rub);
      h += opsH('日', dayTitle(d), e ? '−' + fmtN(e) : '') + l.map(txRow).join('');
    });
    return h;
  }
  function vPlan() {
    const b = budget(), inc = byDay(S.rec.filter(r => r.type === 'inc')), exp = byDay(S.rec.filter(r => r.type === 'exp'));
    const paidN = exp.filter(r => paidTx(r.id)).length;
    let h = `<div class="panel paper shape-b${rv()}" style="padding-bottom:22px">${lbl('План на месяц', '計画')}
      <div class="mid"><span class="num" data-val="${b.planInc - b.fixed}">${fmtN(b.planInc - b.fixed)}</span> ₽</div>
      <div class="sub" style="margin-top:6px">доходы +${fmtN(b.planInc)} · обязательные −${fmtN(b.fixed)}<br>остаётся на ежедневные траты</div></div>`;
    h += opsH('収入', 'Постоянные доходы', '+' + fmtN(b.planInc));
    h += inc.map(r => recRow(r, true)).join('');
    h += `<button class="add-row press${rv()}" data-act="newRec" data-type="inc"><b>+</b>Добавить доход (зарплата, аванс…)</button>`;
    h += opsH('支払', 'Обязательные платежи', `${paidN}/${exp.length} оплачено`);
    h += exp.map(r => recRow(r, true)).join('');
    h += `<button class="add-row press${rv()}" data-act="newRec" data-type="exp"><b>+</b>Добавить платёж (аренда, связь…)</button>`;
    h += `<p class="info${rv()}">«Оплатил» / «Получил» записывает операцию на сегодня с суммой из плана. Сумму и дату потом можно поправить в Истории. Отметки обнуляются с новым месяцем.</p>`;
    return h;
  }
  const vDebt = () => `<div class="panel dark shape-c${rv()}" style="padding:16px">${lbl('В разработке', '工事中')}<p style="margin-top:10px">Кредиты и долги с графиком и процентами — версия 0.6. Накопления и цели — 0.7.</p></div>`;

  /* ---------- отрисовка ---------- */
  function render(animate) {
    anim = animate; ri = 0;
    const top = scroll.scrollTop;
    scroll.innerHTML = head() + { home: vHome, hist: vHist, plan: vPlan, debt: vDebt }[tab]();
    $$('.nav [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    decorate(scroll);
    if (animate) { scroll.scrollTop = 0; setTimeout(() => $$('.scroll .num').forEach(el => scramble(el, +el.dataset.val)), 120); }
    else scroll.scrollTop = top;
  }

  // обёртки панелей A/B и формы кнопок — как в style.html
  function decorate(root) {
    root.querySelectorAll('.panel.shape-a, .panel.shape-b').forEach(el => {
      const w = document.createElement('div'), a = el.classList.contains('shape-a');
      w.className = 'hud-wrap ' + (a ? 'hud-a' : 'hud-b');
      if (el.classList.contains('reveal')) { el.classList.remove('reveal'); w.classList.add('reveal'); w.style.setProperty('--i', el.style.getPropertyValue('--i')); }
      el.replaceWith(w); w.appendChild(el);
      (a ? ['bar', 'hatch-l', 'rail'] : ['bar', 'corner', 'tick']).forEach(c => {
        const i = document.createElement('i'); i.className = c;
        if (c === 'rail') i.innerHTML = '<svg viewBox="0 0 104 90"><path d="M6 2 H64.5 L102 39.5 V82"/></svg>';
        w.appendChild(i);
      });
    });
    shapeButtons(root);
  }
  const BTN_VARIANTS = [
    { tab: [24, 66], h: 6, tl: 12, tr: 18, br: 10, bl: 26 },
    { tab: [38, 84], h: 6, tl: 20, tr: 10, br: 24, bl: 10 },
    { tab: [12, 50], h: 7, tl: 10, tr: 22, br: 12, bl: 20 },
    { tab: [30, 62], h: 5, tl: 16, tr: 14, br: 20, bl: 14 },
  ];
  const btnShape = v => `polygon(0 ${v.tl + v.h}px,${v.tl}px ${v.h}px,${v.tab[0]}% ${v.h}px,calc(${v.tab[0]}% + ${v.h}px) 0,calc(${v.tab[1]}% - ${v.h}px) 0,${v.tab[1]}% ${v.h}px,calc(100% - ${v.tr}px) ${v.h}px,100% ${v.tr + v.h}px,100% calc(100% - ${v.br}px),calc(100% - ${v.br}px) 100%,${v.bl}px 100%,0 calc(100% - ${v.bl}px))`;
  const hash = t => [...t].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  function shapeButtons(root) {
    const groups = new Map();
    root.querySelectorAll('.btn').forEach(b => { const g = b.closest('.panel, .sheet') || root; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(b); });
    groups.forEach(list => {
      const used = new Set();
      list.forEach(b => {
        let k = hash(b.textContent.trim()) % BTN_VARIANTS.length;
        while (used.has(k) && used.size < BTN_VARIANTS.length) k = (k + 1) % BTN_VARIANTS.length;
        used.add(k); b.style.setProperty('--btn-shape', btnShape(BTN_VARIANTS[k]));
      });
    });
  }
  function scramble(el, to, dur = 440) {
    const target = fmtN(to);
    if (reduce) { el.textContent = target; return; }
    const t0 = performance.now();
    (function tick(now) {
      const p = Math.min(1, (now - t0) / dur), settled = Math.floor(p * target.length);
      el.textContent = [...target].map((ch, k) => (k < settled || !/\d/.test(ch)) ? ch : String(Math.floor(Math.random() * 10))).join('');
      if (p < 1) requestAnimationFrame(tick); else el.textContent = target;
    })(t0);
  }

  /* ---------- нижний лист ---------- */
  let form = null;
  const btn = (cls, id, text, tag) => `<button class="btn ${cls} press" data-act="${id}"><span>${text}</span>${tag}</button>`;
  const chip = (on, act, val, text) => `<span class="chip${on ? ' on' : ''}" data-act="${act}" data-v="${esc(val)}">${text}</span>`;
  function openSheet(f) { form = f; drawSheet(); screen.classList.add('sheet-open'); if (!f.id) setTimeout(() => sheet.querySelector('.inp.big')?.focus(), 380); }
  function closeSheet() { screen.classList.remove('sheet-open'); form = null; }
  // перед перерисовкой листа забираем введённое из полей
  function readInputs() { if (!form) return; sheet.querySelectorAll('[data-f]').forEach(i => form[i.dataset.f] = i.value); }
  function drawSheet() {
    const f = form, h = [];
    if (f.kind === 'tx') {
      const inc = f.t === 'inc', locked = !!f.ref;
      h.push(`<h3><span>${f.id ? (inc ? 'Правка дохода' : 'Правка траты') : (inc ? 'Новый доход' : 'Новая трата')}</span><span class="cjk">${inc ? '収入' : '支出'}</span></h3>`);
      if (!f.id) h.push(`<div class="seg">${['exp', 'inc'].map(t => `<button class="${f.t === t ? 'on' : ''}" data-act="setT" data-v="${t}">${t === 'exp' ? 'Трата' : 'Доход'}</button>`).join('')}</div>`);
      if (locked) h.push(`<p class="info">Операция по плану: «${esc(f.note)}». Её можно только удалить — отметка в Плане снимется.</p>`);
      h.push(`<input class="inp big" data-f="amt" inputmode="decimal" placeholder="0" value="${esc(f.amt)}"${locked ? ' disabled' : ''}>`);
      if (f.err) h.push(`<div class="err">${esc(f.err)}</div>`);
      if (!locked) {
        h.push(`<div class="f-lbl">Категория</div><div class="chips">${userCats(f.t).map(c => chip(c.id === f.cat && !f.newCat, 'setCat', c.id, `${ICON[c.name] || '支'} ${SHORT[c.name] || c.name}`)).join('')}</div>`);
        h.push(`<input class="inp" data-f="newCat" placeholder="или впиши свою категорию" value="${esc(f.newCat)}">`);
        if (!inc) h.push(`<div class="f-lbl">На кого</div><div class="chips">${S.persons.map(p => chip(p === f.who, 'setWho', p, esc(p))).join('')}</div>`);
        const td = today();
        h.push(`<div class="f-lbl">Дата</div><div class="date-row"><span class="chip" data-act="dayBack">‹</span><span class="d${f.d === td ? ' today' : ''}" data-act="dayToday">${formDay(f.d)}</span>${f.d < td ? '<span class="chip" data-act="dayFwd">›</span>' : ''}</div>`);
        h.push(`<div class="f-lbl">Заметка</div><input class="inp" data-f="note" placeholder="необязательно" value="${esc(f.note)}">`);
        h.push('<div style="height:12px"></div>' + btn('primary', 'saveTx', 'Записать', '<span class="arrows">⇲⇲</span>'));
      }
      if (f.id) h.push(btn('ghost', 'delTx', f.confirm ? 'Точно удалить?' : 'Удалить', '<span class="cjk">削除</span>'));
      h.push(btn('ghost', 'cancel', 'Отмена', '<span class="cjk">取消</span>'));
    } else {
      const inc = f.type === 'inc';
      h.push(`<h3><span>${f.id ? 'Правка' : 'Новый'} ${inc ? 'доход' : 'платёж'}</span><span class="cjk">${inc ? '収入' : '支払'}</span></h3>`);
      h.push(`<div class="f-lbl">Название</div><input class="inp" data-f="name" placeholder="${inc ? 'Зарплата, аванс…' : 'Аренда, интернет…'}" value="${esc(f.name)}">`);
      h.push(`<div class="f-lbl">Сумма в месяц</div><input class="inp" data-f="amt" inputmode="decimal" placeholder="0" value="${esc(f.amt)}">`);
      h.push(`<div class="f-lbl">Какого числа</div><input class="inp" data-f="day" inputmode="numeric" placeholder="1–31" value="${esc(f.day)}">`);
      if (f.err) h.push(`<div class="err">${esc(f.err)}</div>`);
      h.push(`<div class="f-lbl">Категория</div><div class="chips">${userCats(f.type).map(c => chip(c.id === f.cat, 'setCat', c.id, `${ICON[c.name] || '支'} ${SHORT[c.name] || c.name}`)).join('')}</div>`);
      if (inc) h.push(`<p class="info">Зарплата два раза в месяц — это два дохода: например «Аванс» 10-го и «Зарплата» 25-го.</p>`);
      h.push('<div style="height:12px"></div>' + btn('primary', 'saveRec', 'Сохранить', '<span class="arrows">⇲⇲</span>'));
      if (f.id) h.push(btn('ghost', 'delRec', f.confirm ? 'Точно удалить?' : 'Удалить', '<span class="cjk">削除</span>'));
      h.push(btn('ghost', 'cancel', 'Отмена', '<span class="cjk">取消</span>'));
    }
    sheet.innerHTML = h.join('');
    shapeButtons(sheet);
  }
  const newTx = () => ({ kind: 'tx', t: 'exp', amt: '', cat: userCats('exp')[0]?.id, newCat: '', who: S.persons[0], d: today(), note: '' });

  function toast(t) {
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; screen.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  /* ---------- действия ---------- */
  const A = {
    goPlan() { tab = 'plan'; render(true); },
    newRec(el) { const t = el.dataset.type; openSheet({ kind: 'rec', type: t, name: '', amt: '', day: '', cat: userCats(t)[t === 'exp' ? 3 : 0]?.id }); },
    editRec(el) { const r = S.rec.find(x => x.id === el.dataset.id); openSheet({ kind: 'rec', id: r.id, type: r.type, name: r.name, amt: String(r.amt), day: String(r.day), cat: r.cat }); },
    postRec(el) {
      const r = S.rec.find(x => x.id === el.dataset.id);
      S.tx.push({ id: uid(), ts: Date.now(), t: r.type, amt: r.amt, cur: 'RUB', rub: r.amt, cat: r.cat, acc: '', to: '', who: r.type === 'exp' ? S.persons[0] : '', d: today(), note: r.name, ref: { k: 'rec', id: r.id } });
      save(); render(false); toast(r.type === 'inc' ? 'Отмечено: получено' : 'Отмечено: оплачено');
    },
    editTx(el) {
      const t = S.tx.find(x => x.id === el.dataset.id);
      openSheet({ kind: 'tx', id: t.id, t: t.t, amt: String(t.amt), cat: t.cat, newCat: '', who: t.who || S.persons[0], d: t.d, note: t.note || '', ref: t.ref });
    },
    setT(el) { form.t = el.dataset.v; form.cat = userCats(form.t)[0]?.id; form.newCat = ''; form.err = ''; drawSheet(); },
    setCat(el) { form.cat = el.dataset.v; form.newCat = ''; form.err = ''; drawSheet(); },
    setWho(el) { form.who = el.dataset.v; drawSheet(); },
    dayBack() { form.d = addDays(form.d, -1); drawSheet(); },
    dayFwd() { form.d = addDays(form.d, 1); drawSheet(); },
    dayToday() { form.d = today(); drawSheet(); },
    cancel: closeSheet,
    saveTx() {
      const f = form, amt = parseAmt(f.amt);
      if (amt <= 0) { f.err = 'Введи сумму больше нуля'; return drawSheet(); }
      let catId = f.cat;
      const nc = (f.newCat || '').trim();
      if (nc) {
        const ex = S.cats.find(c => c.type === f.t && c.name.toLowerCase() === nc.toLowerCase());
        catId = ex ? ex.id : (S.cats.push({ id: uid(), name: nc, type: f.t }), S.cats[S.cats.length - 1].id);
      }
      if (!catId) { f.err = 'Выбери или впиши категорию'; return drawSheet(); }
      const old = f.id && S.tx.find(x => x.id === f.id);
      const tx = { id: f.id || uid(), ts: old ? old.ts : Date.now(), t: f.t, amt, cur: 'RUB', rub: amt, cat: catId, acc: '', to: '', who: f.t === 'exp' ? f.who : '', d: f.d, note: (f.note || '').trim() };
      S.tx = S.tx.filter(x => x.id !== tx.id).concat(tx);
      save(); closeSheet(); render(false);
      $$('.scroll .num').forEach(el => scramble(el, +el.dataset.val));
    },
    delTx() {
      if (!form.confirm) { form.confirm = true; return drawSheet(); }
      S.tx = S.tx.filter(x => x.id !== form.id); save(); closeSheet(); render(false);
    },
    saveRec() {
      const f = form, amt = parseAmt(f.amt), day = parseInt(f.day, 10);
      if (!f.name.trim()) { f.err = 'Впиши название'; return drawSheet(); }
      if (amt <= 0) { f.err = 'Введи сумму больше нуля'; return drawSheet(); }
      if (!(day >= 1 && day <= 31)) { f.err = 'Число месяца — от 1 до 31'; return drawSheet(); }
      const r = { id: f.id || uid(), type: f.type, name: f.name.trim(), amt, day, cat: f.cat, acc: '' };
      S.rec = f.id ? S.rec.map(x => x.id === r.id ? r : x) : S.rec.concat(r);
      save(); closeSheet(); render(false);
    },
    delRec() {
      if (!form.confirm) { form.confirm = true; return drawSheet(); }
      // как в kassa.html: уже проведённые операции остаются в истории
      S.rec = S.rec.filter(x => x.id !== form.id); save(); closeSheet(); render(false);
    },
  };
  function onAct(e) {
    const el = e.target.closest('[data-act]'); if (!el) return;
    e.stopPropagation(); readInputs(); A[el.dataset.act]?.(el);
  }
  scroll.addEventListener('click', onAct);
  sheet.addEventListener('click', onAct);
  sheet.addEventListener('keydown', e => { if (e.key === 'Enter' && form) { readInputs(); (form.kind === 'tx' ? A.saveTx : A.saveRec)(); } });
  $('#scrim').onclick = closeSheet;
  $('#fab').onclick = () => openSheet(newTx());
  $$('.nav [data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(true); });

  /* ---------- пример и очистка ---------- */
  $('#demoBtn').onclick = () => {
    S = defaults();
    const c = n => S.cats.find(x => x.name === n).id, td = today(), dn = new Date().getDate();
    const R = (type, name, amt, day, cat) => ({ id: uid(), type, name, amt, day, cat: c(cat), acc: '' });
    S.rec = [R('inc', 'Аванс', 45000, 10, 'Зарплата'), R('inc', 'Зарплата', 65000, 25, 'Зарплата'),
      R('exp', 'Аренда квартиры', 38000, 5, 'Дом'), R('exp', 'Коммуналка', 6200, 15, 'Дом'),
      R('exp', 'Интернет', 900, 12, 'Связь и подписки'), R('exp', 'Мобильная связь', 650, 28, 'Связь и подписки'), R('exp', 'Спортзал', 3500, 1, 'Здоровье')];
    const T = (d, t, amt, cat, note, ref, who = 'Я') => S.tx.push({ id: uid(), ts: new Date(d + 'T' + String(9 + S.tx.length % 10).padStart(2, '0') + ':' + String(S.tx.length * 7 % 60).padStart(2, '0')).getTime(), t, amt, cur: 'RUB', rub: amt, cat, acc: '', to: '', who: t === 'exp' ? who : '', d, note, ref });
    // по плану: проведено всё, у чего срок уже прошёл, кроме коммуналки (пусть «срок был»)
    S.rec.filter(r => r.day <= dn && r.name !== 'Коммуналка').forEach(r => T(addDays(td, -Math.min(dn - r.day, dn - 1)), r.type, r.amt, r.cat, r.name, { k: 'rec', id: r.id }));
    const daily = [['Продукты', 1840], ['Кафе и рестораны', 420], ['Транспорт', 180], ['Продукты', 960], ['Развлечения', 1200], ['Кафе и рестораны', 650], ['Продукты', 2300], ['Одежда', 3900], ['Транспорт', 300], ['Продукты', 1450]];
    for (let i = 1; i < Math.min(dn, 12); i++) { const [n, a] = daily[i % daily.length]; T(addDays(td, -i), 'exp', a, c(n), '', undefined, i % 4 === 0 ? 'Варя' : 'Я'); }
    T(td, 'exp', 540, c('Продукты'), 'Пятёрочка'); T(td, 'exp', 220, c('Кафе и рестораны'), 'кофе');
    T(addDays(td, -3), 'inc', 1500, c('Подработка'), 'перевод за макет');
    save(); tab = 'home'; render(true);
  };
  $('#clearBtn').onclick = () => { S = defaults(); save(); render(true); };
  $$('[data-fs]').forEach(b => b.onclick = () => {
    $('.phone').style.setProperty('--fs', b.dataset.fs);
    $$('[data-fs]').forEach(x => x.classList.toggle('on', x === b));
  });

  /* ---------- глитч: раз в 15–40 с, не при открытом листе ---------- */
  function fire(el) { if (reduce || !el) return; el.classList.remove('fire'); void el.offsetWidth; el.classList.add('fire'); setTimeout(() => el.classList.remove('fire'), 200); }
  function glitchOnce() {
    if (screen.classList.contains('sheet-open')) return;
    const pool = [$('#heroNum'), $('.head h1')].filter(Boolean);
    fire(pool[Math.floor(Math.random() * pool.length)]);
    if (Math.random() < .4 && !reduce) { tearEl.style.top = (10 + Math.random() * 80) + '%'; tearEl.classList.remove('on'); void tearEl.offsetWidth; tearEl.classList.add('on'); setTimeout(() => tearEl.classList.remove('on'), 180); }
  }
  (function loop() { setTimeout(() => { glitchOnce(); loop(); }, 15000 + Math.random() * 25000); })();

  render(true);
})();
</script>
</body>
</html>
